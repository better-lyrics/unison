version: 2
updates:
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: daily
    cooldown:
      default-days: 3
      exclude: ["@braccato/*"]
    allow:
      - dependency-name: "@braccato/*"
    groups:
      braccato:
        patterns: ["@braccato/*"]
        update-types: [minor, patch]
