[package]
name = "detection-service"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "detection_service"
path = "src/lib.rs"

[[bin]]
name = "detection-service"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lingua = "1.8"
rayon = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
